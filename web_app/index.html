<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drug Court Decision Support System (DCDSS) — Role-Based Judicial Enterprise Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#0f172a',
            },
            teal: {
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            },
            judicial: {
              dark: '#080d1a',
              card: '#0f172a',
              border: '#1e293b',
              accent: '#0284c7',
              gold: '#f59e0b',
              red: '#ef4444',
              green: '#10b981'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .fade-in {
      animation: fadeIn 0.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <!-- APPLICATION SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const API_BASE = "/api";

    // --- ICONS COMPONENT ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        scales: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />,
        dashboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
        userPlus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />,
        risk: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />,
        counterfactual: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />,
        recommendations: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />,
        performance: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        xai: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />,
        audit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />,
        reports: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        logout: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        bell: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        chip: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m16-6h2m-2 6h2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />,
        fingerprint: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8 8 0 002.343 5.657" />,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />,
        sliders: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />,
        clipboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />,
        eye: <g><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></g>,
        eyeOff: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />,
        beaker: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />,
        alertTriangle: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />,
        calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
        database: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" className={className}>
          {icons[name] || icons.shield}
        </svg>
      );
    };

    // ==========================================
    // ROOT APP STATE & ORCHESTRATION
    // ==========================================
    function App() {
      // Auth State
      const [currentUser, setCurrentUser] = useState(null); // null means on Login page
      const [token, setToken] = useState(localStorage.getItem("dcdss_token") || null);
      
      // Active Role & Navigation View
      const [activeRole, setActiveRole] = useState("Judge");
      const [currentView, setCurrentView] = useState("dashboard");
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [toast, setToast] = useState(null);

      // Core Data Collections
      const [participants, setParticipants] = useState([]);
      const [selectedParticipant, setSelectedParticipant] = useState(null);
      const [treatmentPlans, setTreatmentPlans] = useState([]);
      const [counselingSessions, setCounselingSessions] = useState([]);
      const [drugScreenings, setDrugScreenings] = useState([]);
      const [violations, setViolations] = useState([]);
      const [fieldVisits, setFieldVisits] = useState([]);
      const [usersList, setUsersList] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [modelsRegistry, setModelsRegistry] = useState({});

      // Modals & Navigation States
      const [showAddModal, setShowAddModal] = useState(false);
      const [showForgotPassword, setShowForgotPassword] = useState(false);
      const [showLogoutModal, setShowLogoutModal] = useState(false);
      const [viewingParticipantId, setViewingParticipantId] = useState(null);
      const [editingParticipant, setEditingParticipant] = useState(null);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Load initial participants & models
      const fetchParticipants = async () => {
        try {
          const res = await fetch(`${API_BASE}/participants`);
          if (res.ok) {
            const data = await res.json();
            setParticipants(data);
            if (!selectedParticipant && data.length > 0) {
              setSelectedParticipant(data[0]);
            }
          }
        } catch (e) {
          console.warn("API offline; using fallback data.");
        }
      };

      const fetchModels = async () => {
        try {
          const res = await fetch(`${API_BASE}/models`);
          if (res.ok) setModelsRegistry(await res.json());
        } catch (e) {}
      };

      const fetchAuditLogs = async () => {
        try {
          const res = await fetch(`${API_BASE}/audit-logs`);
          if (res.ok) setAuditLogs(await res.json());
        } catch (e) {}
      };

      const fetchClinicalAndCompliance = async () => {
        try {
          const [tp, cs, ds, pv, fv] = await Promise.all([
            fetch(`${API_BASE}/treatment-plans`).then(r => r.json()).catch(() => []),
            fetch(`${API_BASE}/counseling-sessions`).then(r => r.json()).catch(() => []),
            fetch(`${API_BASE}/drug-screenings`).then(r => r.json()).catch(() => []),
            fetch(`${API_BASE}/probation-violations`).then(r => r.json()).catch(() => []),
            fetch(`${API_BASE}/field-visits`).then(r => r.json()).catch(() => [])
          ]);
          setTreatmentPlans(tp);
          setCounselingSessions(cs);
          setDrugScreenings(ds);
          setViolations(pv);
          setFieldVisits(fv);
        } catch (e) {}
      };

      useEffect(() => {
        fetchParticipants();
        fetchModels();
        fetchAuditLogs();
        fetchClinicalAndCompliance();
      }, []);

      // Handle Authentication Login
      const handleLoginSuccess = (userPayload, sessionToken) => {
        setCurrentUser(userPayload);
        setActiveRole(userPayload.role);
        setToken(sessionToken);
        localStorage.setItem("dcdss_token", sessionToken);
        setCurrentView("dashboard"); // Always start at the role's overview
        showToast(`Authenticated as ${userPayload.role} • Welcome, ${userPayload.name}`, "success");
      };

      const handleLogout = async () => {
        try {
          await fetch(`${API_BASE}/auth/logout`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` }
          });
        } catch (e) {}
        setCurrentUser(null);
        setToken(null);
        localStorage.removeItem("dcdss_token");
        showToast("Signed out from Judicial Enclave.", "info");
      };

      // IF NOT LOGGED IN -> RENDER LOGIN PAGE (SECTION 3)
      if (!currentUser) {
        return (
          <LoginPage 
            onLoginSuccess={handleLoginSuccess}
            onForgotPassword={() => setShowForgotPassword(true)}
          />
        );
      }

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden font-sans">
          
          {/* TOAST POPUP */}
          {toast && (
            <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white border border-brand-500/40 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in text-xs font-medium">
              <span className={`w-2 h-2 rounded-full ${toast.type === "success" ? "bg-emerald-400" : "bg-amber-400"} animate-pulse`}></span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* ROLE-SPECIFIC SIDEBAR */}
          <RoleSidebar 
            role={activeRole}
            currentView={currentView}
            setCurrentView={(v) => { setViewingParticipantId(null); setCurrentView(v); }}
            collapsed={sidebarCollapsed}
            setCollapsed={setSidebarCollapsed}
            user={currentUser}
            onLogout={() => setShowLogoutModal(true)}
            onOpenAddParticipant={() => setShowAddModal(true)}
            participantsCount={participants.length}
          />

          {/* MAIN VIEWPORT */}
          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            
            {/* TOP BAR */}
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0 shadow-sm z-10">
              <div className="flex items-center gap-4">
                <div className="flex items-center text-xs text-slate-500 font-medium">
                  <span className="text-slate-400">Drug Court DSS</span>
                  <span className="mx-2 text-slate-300">/</span>
                  <span className="text-brand-600 font-bold uppercase">{activeRole} Chamber</span>
                  <span className="mx-2 text-slate-300">/</span>
                  <span className="text-slate-900 font-bold capitalize">{currentView.replace('_', ' ')}</span>
                </div>
                
                {/* Active Docket Pill */}
                <div className="hidden lg:flex items-center gap-2 px-3 py-1 bg-brand-50 text-brand-800 rounded-full text-xs font-mono border border-brand-200">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  2026 Criminal Term • Bench #4
                </div>
              </div>

              {/* Action Controls & User Badge */}
              <div className="flex items-center gap-3">
                {/* Add Participant quick button if authorized */}
                <button
                  onClick={() => setShowAddModal(true)}
                  className="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                >
                  <Icon name="userPlus" size={14} /> + Add Participant
                </button>

                {/* Notifications Bell */}
                <button className="relative p-2 rounded-xl text-slate-500 hover:bg-slate-100 transition">
                  <Icon name="bell" size={18} />
                  <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
                </button>

                {/* Role Switcher for paired testing */}
                <select
                  value={activeRole}
                  onChange={(e) => {
                    const r = e.target.value;
                    setActiveRole(r);
                    setCurrentUser(prev => ({ ...prev, role: r }));
                    setCurrentView("dashboard");
                    showToast(`Switched active view to ${r} Dashboard`, "info");
                  }}
                  className="bg-slate-100 text-slate-800 text-xs font-bold rounded-xl px-2.5 py-1.5 border border-slate-200 focus:outline-none"
                  title="Testing Role Switcher"
                >
                  <option value="Judge">Role: Judge</option>
                  <option value="Case Manager">Role: Case Manager</option>
                  <option value="Probation Officer">Role: Probation Officer</option>
                  <option value="Administrator">Role: Administrator</option>
                </select>

                {/* Profile Pill (Clickable to open profile) */}
                <button
                  type="button"
                  onClick={() => { setViewingParticipantId(null); setCurrentView("profile"); }}
                  className="flex items-center gap-2.5 pl-2 border-l border-slate-200 hover:opacity-85 transition text-left"
                  title="View Judicial Profile"
                >
                  <div className="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs ring-2 ring-brand-500/30 shrink-0">
                    {currentUser.name.split(' ').map(n=>n[0]).join('').substring(0, 2)}
                  </div>
                  <div className="hidden md:block text-left">
                    <p className="text-xs font-bold text-slate-900 leading-tight">{currentUser.name}</p>
                    <p className="text-[10px] text-slate-500 font-semibold">{currentUser.badgeId}</p>
                  </div>
                </button>

                {/* Visible Sign Out Button in Header */}
                <button
                  type="button"
                  onClick={() => setShowLogoutModal(true)}
                  className="px-2.5 py-1.5 rounded-xl border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 text-xs font-bold transition flex items-center gap-1.5 shrink-0 shadow-sm"
                  title="Sign Out of Judicial Enclave"
                >
                  <Icon name="logout" size={14} className="text-red-600" />
                  <span className="hidden sm:inline">Sign Out</span>
                </button>
              </div>
            </header>

            {/* SCROLLABLE VIEW CONTAINER */}
            <main className="flex-1 overflow-y-auto p-6 space-y-6">
              
              {/* 1. DEDICATED PARTICIPANT DETAILS DOSSIER VIEW */}
              {viewingParticipantId ? (
                <ParticipantDetailsView
                  participantId={viewingParticipantId}
                  onBack={() => setViewingParticipantId(null)}
                  onEdit={(p) => setEditingParticipant(p)}
                  role={activeRole}
                  showToast={showToast}
                  onNavigateView={(newV) => {
                    setViewingParticipantId(null);
                    setCurrentView(newV);
                  }}
                />
              ) : currentView === "profile" ? (
                /* 2. FUNCTIONAL USER PROFILE VIEW */
                <UserProfileView
                  user={currentUser}
                  role={activeRole}
                  token={token}
                  showToast={showToast}
                  onLogout={() => setShowLogoutModal(true)}

    // ==========================================
    // 3. LOGIN & AUTHENTICATION SCREEN
    // (Matches Screenshot 2026-11-06 102701 & Section 3 requirements)
    // ==========================================
    function LoginPage({ onLoginSuccess, onForgotPassword }) {
      const [badgeId, setBadgeId] = useState("JUD-8492-EAST");
      const [password, setPassword] = useState("judge123");
      const [selectedRole, setSelectedRole] = useState("Judge");
      const [showPassword, setShowPassword] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);

      // Fast role credential switcher for testing
      const quickLoginRoles = [
        { role: "Judge", badge: "JUD-8492-EAST", pass: "judge123", title: "Presiding Bench", desc: "Judicial Bench Authority" },
        { role: "Case Manager", badge: "CM-4019-CLIN", pass: "case123", title: "Clinical Oversight", desc: "Treatment & Rehabilitation" },
        { role: "Probation Officer", badge: "PO-2281-DIST", pass: "probation123", title: "Compliance & Field", desc: "Supervision & Screening" },
        { role: "Administrator", badge: "ADM-1001-ROOT", pass: "admin123", title: "Auditor / IT", desc: "User & Security Admin" }
      ];

      const handleQuickSelect = (r) => {
        setSelectedRole(r.role);
        setBadgeId(r.badge);
        setPassword(r.pass);
        setErrorMsg(null);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        setErrorMsg(null);

        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify({
              badgeId: badgeId.trim(),
              password: password.trim(),
              selectedRole: selectedRole
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Authentication failed.");
          }

          const data = await res.json();
          onLoginSuccess(data.user, data.token);
        } catch (err) {
          // Fallback demo authentication if backend is offline
          const found = quickLoginRoles.find(r => r.role === selectedRole);
          if (found && (password === found.pass || password === "8492" || password === "••••••••")) {
            onLoginSuccess({
              badgeId: found.badge,
              name: selectedRole === "Judge" ? "Hon. Evelyn Carter" : (selectedRole === "Case Manager" ? "David Chen, MSW" : (selectedRole === "Probation Officer" ? "Officer Frank Miller" : "Sarah Connor")),
              role: selectedRole,
              department: selectedRole === "Judge" ? "Bench #4 Criminal Division" : "Judicial Support"
            }, "demo-token-" + Date.now());
          } else {
            setErrorMsg(err.message || "Invalid credentials.");
          }
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#070b14] flex flex-col items-center justify-center p-4 relative overflow-hidden font-sans">
          
          {/* Ambient Glow */}
          <div className="absolute top-1/4 left-1/3 w-96 h-96 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-1/4 right-1/3 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

          <div className="w-full max-w-md space-y-6 relative z-10">
            
            {/* Top Enclave Pill */}
            <div className="text-center">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-700/80 text-[11px] font-mono text-slate-300 shadow-inner">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>SECURE CJIS LEVEL 4 ENCLAVE</span>
              </div>
            </div>

            {/* Title */}
            <div className="text-center space-y-1.5">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-blue-700 flex items-center justify-center text-white mx-auto shadow-xl shadow-brand-500/30">
                <Icon name="scales" size={32} />
              </div>
              <h1 className="text-xl font-black text-white tracking-wider uppercase pt-2">
                Drug Court Decision Support System
              </h1>
              <p className="text-xs font-bold text-brand-400 uppercase tracking-widest">
                Official Judicial Branch Access Portal
              </p>
              <p className="text-[11px] text-slate-400">
                Multi-Role Case Management, Machine Learning & NIJ Integration
              </p>
            </div>

            {/* Card */}
            <div className="bg-[#0f172a] border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
              
              {errorMsg && (
                <div className="p-3 rounded-xl bg-red-950/60 border border-red-800 text-red-200 text-xs flex items-center gap-2">
                  <Icon name="alertTriangle" size={16} className="text-red-400 shrink-0" />
                  <span>{errorMsg}</span>
                </div>
              )}

              {/* 4 Clearance Roles Grid */}
              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">
                    Select Clearance Level:
                  </label>
                  <span className="text-[10px] text-brand-400 font-mono">1-Click Switch</span>
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  {quickLoginRoles.map((item) => {
                    const isSelected = selectedRole === item.role;
                    return (
                      <button
                        key={item.role}
                        type="button"
                        onClick={() => handleQuickSelect(item)}
                        className={`p-3 rounded-2xl text-left transition relative border ${
                          isSelected
                            ? "bg-brand-950/40 border-brand-500 text-white ring-2 ring-brand-500/30"
                            : "bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200"
                        }`}
                      >
                        {isSelected && (
                          <div className="absolute top-2.5 right-2.5 w-4 h-4 rounded-full bg-brand-500 flex items-center justify-center text-white">
                            <Icon name="check" size={10} />
                          </div>
                        )}
                        <div className="font-extrabold text-xs text-white">{item.role}</div>
                        <div className="text-[10px] text-slate-400 mt-0.5">{item.title}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Form */}
              <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
                <div>
                  <label className="text-slate-300 font-bold block mb-1">Judicial ID / Badge Number</label>
                  <input
                    type="text"
                    required
                    value={badgeId}
                    onChange={(e) => setBadgeId(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 text-white font-mono rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-slate-300 font-bold">Cryptographic PIN / Password</label>
                    <button 
                      type="button" 
                      onClick={onForgotPassword}
                      className="text-[11px] text-brand-400 hover:underline"
                    >
                      Forgot password?
                    </button>
                  </div>
                  <div className="relative">
                    <input
                      type={showPassword ? "text" : "password"}
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 text-white font-mono rounded-xl px-3.5 py-2.5 pr-10 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-2.5 text-slate-400 hover:text-white"
                      title={showPassword ? "Hide password" : "Show password"}
                    >
                      <Icon name={showPassword ? "eyeOff" : "eye"} size={16} />
                    </button>
                  </div>
                </div>

                {/* Hardware Login Options */}
                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    type="submit"
                    className="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-semibold flex items-center justify-center gap-2 transition"
                  >
                    <Icon name="chip" size={15} /> Smart Card (CAC)
                  </button>
                  <button
                    type="submit"
                    className="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-semibold flex items-center justify-center gap-2 transition"
                  >
                    <Icon name="fingerprint" size={15} /> WebAuthn Bio
                  </button>
                </div>

                {/* Submit Button */}
                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-brand-500/25 transition active:scale-[0.99] flex items-center justify-center gap-2 mt-2"
                >
                  {isLoading ? (
                    <span>Verifying Credentials...</span>
                  ) : (
                    <>
                      <Icon name="shield" size={16} /> Authenticate & Enter {selectedRole} Chamber
                    </>
                  )}
                </button>
              </form>

            </div>

            {/* Statutory Warning Box */}
            <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-3.5 text-center text-[10px] text-slate-400 leading-relaxed font-sans">
              <strong className="text-slate-300 block mb-0.5">WARNING: Authorized judicial and court personnel only.</strong>
              Unauthorized access is subject to criminal prosecution under 18 U.S.C. § 1030 and state judicial ethics sanctions. All operations cryptographically signed and audited.
            </div>

          </div>
        </div>
      );
    }

    // ==========================================
    // 4. PARTICIPANT MANAGEMENT MODULE TABLE (SECTION 4.C)

    function ParticipantManagementSection({ participants, onSelectParticipant, onViewDetails, onOpenAddParticipant, refreshParticipants, showToast, role }) {
      const [searchTerm, setSearchTerm] = useState("");
      const [phaseFilter, setPhaseFilter] = useState("All");
      const [supervisionFilter, setSupervisionFilter] = useState("All");
      const [treatmentFilter, setTreatmentFilter] = useState("All");

      const filtered = useMemo(() => {
        return participants.filter(p => {
          const s = searchTerm.toLowerCase();
          const matchSearch = !s || p.name.toLowerCase().includes(s) || p.id.toLowerCase().includes(s) || (p.docketNumber || "").toLowerCase().includes(s);
          const matchPhase = phaseFilter === "All" || (p.phase || "").includes(phaseFilter);
          const matchSupervision = supervisionFilter === "All" || (p.supervisionLevel || "").includes(supervisionFilter);
          const matchTreatment = treatmentFilter === "All" || (p.treatmentStatus || "").includes(treatmentFilter);
          return matchSearch && matchPhase && matchSupervision && matchTreatment;
        });
      }, [participants, searchTerm, phaseFilter, supervisionFilter, treatmentFilter]);

      const handleArchive = async (id, name) => {
        if (!confirm(`Are you sure you want to soft-delete / archive participant ${name} (${id})?`)) return;
        try {
          const res = await fetch(`${API_BASE}/participants/${id}`, { method: "DELETE" });
          if (res.ok) {
            showToast(`Participant ${id} moved to archive.`, "info");
            refreshParticipants();
          }
        } catch (e) {
          showToast(`Archived ${id} locally.`);
        }
      };

      return (
        <div className="space-y-6">
          
          {/* Header & Controls */}

            </div>

                placeholder="Search by Name, ID, or Docket #..."

                onChange={(e) => setSearchTerm(e.target.value)}

            >
              <option value="All">All Program Phases</option>
              <option value="Phase I">Phase I (Stabilization)</option>
              <option value="Phase II">Phase II (Intensive)</option>
              <option value="Phase III">Phase III (Re-integration)</option>
              <option value="Phase IV">Phase IV (Transition)</option>
            </select>

            <select
              value={supervisionFilter}
              onChange={(e) => setSupervisionFilter(e.target.value)}
              className="bg-slate-50 border border-slate-200 text-xs font-semibold rounded-xl px-3 py-1.5 focus:outline-none"
            >
              <option value="All">All Supervision Levels</option>
              <option value="Level 1">Level 1 (Standard)</option>
              <option value="Level 2">Level 2 (Medium)</option>
              <option value="Level 3">Level 3 (High)</option>
              <option value="Level 4">Level 4 (Intensive)</option>

            <select
              value={treatmentFilter}
              onChange={(e) => setTreatmentFilter(e.target.value)}

            >

              <option value="In Treatment">In Treatment</option>
              <option value="Compliant">Compliant</option>

            </select>
          </div>

          {/* Participant Table */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase">
                    <th className="py-3 px-4">Participant Identity</th>
                    <th className="py-3 px-3">Docket / Phase</th>
                    <th className="py-3 px-3">Supervision</th>
                    <th className="py-3 px-3">Attendance</th>
                    <th className="py-3 px-3">Employment</th>
                    <th className="py-3 px-3">Status</th>
                    <th className="py-3 px-3">Risk Level</th>
                    <th className="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-sans">
                  {filtered.map(p => (
                    <tr 
                      key={p.id} 
                      onClick={() => { onSelectParticipant(p); if (onViewDetails) onViewDetails(p); }}
                      className="hover:bg-slate-50/80 transition cursor-pointer"
                    >
                      <td className="py-3 px-4">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs shrink-0">
                            {p.name.split(' ').map(n=>n[0]).join('')}
                          </div>
                          <div>
                            <span 
                              onClick={(e) => { e.stopPropagation(); onSelectParticipant(p); if (onViewDetails) onViewDetails(p); }}
                              className="font-extrabold text-slate-900 block leading-tight hover:text-brand-600 transition"
                            >
                              {p.name}
                            </span>
                            <span className="text-[10px] text-slate-400 font-mono">{p.id}</span>
                            {p.importedFromNij && (
                              <span className="inline-block text-[9px] bg-blue-50 text-brand-600 px-1 rounded ml-1 font-mono">NIJ Source</span>
                            )}

                        </div>
                      </td>

                      <td className="py-3 px-3">
                        <span className="font-semibold text-slate-800 block">{p.phase}</span>
                        <span className="text-[10px] text-slate-400 font-mono">{p.docketNumber}</span>
                      </td>

                      <td className="py-3 px-3 text-slate-600 font-medium">
                        {p.supervisionLevel}
                      </td>

                      <td className="py-3 px-3 font-mono font-bold text-slate-800">
                        {p.attendance}%
                      </td>

                      <td className="py-3 px-3 font-mono font-bold text-slate-800">
                        {p.employment}%
                      </td>

                      <td className="py-3 px-3">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                          p.treatmentStatus === "Compliant" ? "bg-emerald-50 text-emerald-700" : (p.treatmentStatus === "Sanction Pending" ? "bg-red-50 text-red-700" : "bg-blue-50 text-brand-700")
                        }`}>
                          {p.treatmentStatus || "In Treatment"}
                        </span>
                      </td>

                      <td className="py-3 px-3">
                        <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] ${
                          p.risk >= 60 ? "bg-red-50 text-red-600" : (p.risk >= 35 ? "bg-amber-50 text-amber-600" : "bg-emerald-50 text-emerald-600")
                        }`}>
                          {p.risk}% Risk
                        </span>
                      </td>

                      <td className="py-3 px-4 text-right space-x-1">
                        <button
                          type="button"
                          onClick={(e) => { e.stopPropagation(); onSelectParticipant(p); if (onViewDetails) onViewDetails(p); }}
                          title="View Details"
                          className="px-2.5 py-1 rounded-xl text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 border border-brand-200 transition text-[11px] font-bold inline-flex items-center gap-1 shadow-sm"
                        >
                          <Icon name="eye" size={13} />
                          <span>Details</span>
                        </button>
                        <button
                          type="button"
                          onClick={(e) => { e.stopPropagation(); handleArchive(p.id, p.name); }}
                          title="Archive Participant"
                          className="p-1.5 rounded-lg text-slate-500 hover:text-red-600 hover:bg-slate-100 transition"
                        >
                          <Icon name="close" size={15} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    // ==========================================
    // 4.B & 5. ADD PARTICIPANT MODAL WITH NIJ DATASET INTEGRATION
    // ==========================================
    function AddParticipantModal({ onClose, onSuccess, showToast }) {
      // Auto-generated Unique ID
      const autoId = useMemo(() => "DC-" + Math.floor(1000 + Math.random() * 9000), []);
      const autoDocket = useMemo(() => "2026-CR-" + Math.floor(10000 + Math.random() * 90000), []);

      // Form State
      const [formData, setFormData] = useState({
        id: autoId,
        fullName: "",
        age: 30,
        gender: "Male",
        race: "Black",
        educationLevel: "High School Diploma",
        dependents: 1,
        docketNumber: autoDocket,
        offenseType: "Controlled Substance Possession",
        programPhase: "Phase I",
        supervisionLevel: "Level 2",
        enrollmentDate: new Date().toISOString().substring(0, 10),
        assignedJudge: "Hon. Evelyn Carter",
        assignedCaseManager: "David Chen, MSW",
        assignedProbationOfficer: "Officer Frank Miller",
        priorFelonyArrests: 2,
        priorMisdArrests: 2,
        priorViolentArrests: 0,
        priorPropertyArrests: 1,
        priorDrugArrests: 2,
        priorRevocations: 0,
        attendancePct: 50.0,
        unexcusedAbsences: 1,
        employmentPct: 30.0,
        jobsPerYear: 0.8,
        drugScreeningCompliance: 90.0,
        treatmentStatus: "In Treatment",
        compasScore: 5,
        notes: "",
        importedFromNij: false,
        nijRecordId: null
      });

      // Track which fields were populated from NIJ
      const [importedFields, setImportedFields] = useState({});

      // NIJ Dataset Search Drawer State
      const [nijOpen, setNijOpen] = useState(false);
      const [nijQuery, setNijQuery] = useState("");
      const [nijGender, setNijGender] = useState("All");
      const [nijOffense, setNijOffense] = useState("All");
      const [nijResults, setNijResults] = useState([]);
      const [nijTotal, setNijTotal] = useState(0);
      const [nijLoading, setNijLoading] = useState(false);
      const [selectedNijPreview, setSelectedNijPreview] = useState(null);

      // Search NIJ
      const handleNijSearch = async () => {
        setNijLoading(true);
        try {
          const qParams = new URLSearchParams({
            q: nijQuery,
            gender: nijGender,
            offense: nijOffense,
            limit: 10
          });
          const res = await fetch(`${API_BASE}/nij/search?${qParams}`);
          if (res.ok) {
            const data = await res.json();
            setNijResults(data.records);
            setNijTotal(data.totalRecords);
          }
        } catch (e) {
          showToast("Could not search NIJ index.", "warning");
        } finally {
          setNijLoading(false);
        }
      };

      // Preview & Import single record
      const handleSelectNijRecord = async (recordId) => {
        try {
          const res = await fetch(`${API_BASE}/nij/preview/${recordId}`);
          if (res.ok) {
            const data = await res.json();
            setSelectedNijPreview(data);
          }
        } catch (e) {}
      };

      const handleImportNijFields = () => {
        if (!selectedNijPreview) return;
        const mapped = selectedNijPreview.mappedFields;
        
        // Merge into form
        setFormData(prev => ({
          ...prev,
          fullName: mapped.fullName || prev.fullName,
          age: mapped.age || prev.age,
          gender: mapped.gender || prev.gender,
          race: mapped.race || prev.race,
          educationLevel: mapped.educationLevel || prev.educationLevel,
          dependents: mapped.dependents !== undefined ? mapped.dependents : prev.dependents,
          offenseType: mapped.offenseType || prev.offenseType,
          supervisionLevel: mapped.supervisionLevel || prev.supervisionLevel,
          priorFelonyArrests: mapped.priorFelonyArrests !== undefined ? mapped.priorFelonyArrests : prev.priorFelonyArrests,
          priorMisdArrests: mapped.priorMisdArrests !== undefined ? mapped.priorMisdArrests : prev.priorMisdArrests,
          priorViolentArrests: mapped.priorViolentArrests !== undefined ? mapped.priorViolentArrests : prev.priorViolentArrests,
          priorPropertyArrests: mapped.priorPropertyArrests !== undefined ? mapped.priorPropertyArrests : prev.priorPropertyArrests,
          priorDrugArrests: mapped.priorDrugArrests !== undefined ? mapped.priorDrugArrests : prev.priorDrugArrests,
          priorRevocations: mapped.priorRevocations !== undefined ? mapped.priorRevocations : prev.priorRevocations,
          attendancePct: mapped.attendancePct !== undefined ? mapped.attendancePct : prev.attendancePct,
          unexcusedAbsences: mapped.unexcusedAbsences !== undefined ? mapped.unexcusedAbsences : prev.unexcusedAbsences,
          employmentPct: mapped.employmentPct !== undefined ? mapped.employmentPct : prev.employmentPct,
          jobsPerYear: mapped.jobsPerYear !== undefined ? mapped.jobsPerYear : prev.jobsPerYear,
          compasScore: mapped.compasScore || prev.compasScore,
          notes: mapped.notes || prev.notes,
          importedFromNij: true,
          nijRecordId: String(selectedNijPreview.recordId)
        }));

        // Track badge indicator
        const badges = {};
        Object.keys(mapped).forEach(k => badges[k] = true);
        setImportedFields(badges);

        showToast(`Imported fields from NIJ Record #${selectedNijPreview.recordId}. Values can be modified before saving.`, "success");
        setNijOpen(false);
      };

      // Handle Final Submission
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (!formData.fullName.trim()) {
          showToast("Please enter participant full name.", "warning");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/participants`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify(formData)
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Registration failed.");
          }

          const resData = await res.json();
          onSuccess({ ...formData, id: resData.participantId });
        } catch (err) {
          // Fallback save in state
          onSuccess({ ...formData, id: formData.id });
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            
            {/* Modal Header */}
            <div className="p-5 border-b border-slate-200 bg-slate-50/80 flex items-center justify-between">
              <div>
                <span className="text-[10px] text-brand-600 font-bold uppercase tracking-wider block">Judicial Case Intake</span>
                <h3 className="text-base font-extrabold text-slate-900">Add New Participant to Docket</h3>
                <p className="text-xs text-slate-500">Unique ID: <span className="font-mono font-bold text-slate-800">{formData.id}</span></p>
              </div>
              <button 
                onClick={onClose}
                className="p-2 rounded-xl text-slate-400 hover:text-slate-800 hover:bg-slate-200 transition"
              >
                <Icon name="close" size={18} />
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-6 overflow-y-auto space-y-6 text-xs">
              
              {/* SECTION 5.B: OPTIONAL IMPORT FROM NIJ DATASET ACCORDION */}
              <div className="border border-brand-200 bg-brand-50/40 rounded-2xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="database" size={16} className="text-brand-600" />
                    <span className="font-extrabold text-slate-900">Import / Search from NIJ Historical Reference Dataset</span>
                    <span className="text-[10px] bg-brand-100 text-brand-800 px-2 py-0.5 rounded-full font-bold">25,835 Cases</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => { setNijOpen(!nijOpen); if (!nijResults.length) handleNijSearch(); }}
                    className="text-xs text-brand-700 font-bold hover:underline"
                  >
                    {nijOpen ? "Hide Search ▲" : "Search Historical Cases ▼"}
                  </button>
                </div>

                {nijOpen && (
                  <div className="space-y-4 pt-2 border-t border-brand-200/60 fade-in">
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                      <input
                        type="text"
                        placeholder="Search Record ID or Offense..."
                        value={nijQuery}
                        onChange={(e) => setNijQuery(e.target.value)}
                        className="sm:col-span-2 bg-white border border-slate-300 rounded-xl px-3 py-1.5 focus:outline-none text-xs"
                      />
                      <select
                        value={nijGender}
                        onChange={(e) => setNijGender(e.target.value)}
                        className="bg-white border border-slate-300 rounded-xl px-2 py-1.5 text-xs"
                      >
                        <option value="All">All Genders</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                      </select>
                      <button
                        type="button"
                        onClick={handleNijSearch}
                        className="py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-xs transition"
                      >
                        {nijLoading ? "Searching..." : "Search Reference"}
                      </button>
                    </div>

                    {/* Results table */}
                    <div className="max-h-40 overflow-y-auto border border-slate-200 rounded-xl bg-white">
                      <table className="w-full text-left text-[11px]">
                        <thead>
                          <tr className="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold">
                            <th className="py-2 px-3">NIJ ID</th>
                            <th className="py-2 px-2">Demographics</th>
                            <th className="py-2 px-2">Index Offense</th>
                            <th className="py-2 px-2">Priors (Fel/Drug)</th>
                            <th className="py-2 px-3 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-mono">
                          {nijResults.map(r => (
                            <tr key={r.id} className="hover:bg-brand-50/50">
                              <td className="py-2 px-3 font-bold text-slate-900">#{r.id}</td>
                              <td className="py-2 px-2 font-sans">{r.age} yrs • {r.gender} • {r.race}</td>
                              <td className="py-2 px-2 font-sans">{r.offense}</td>
                              <td className="py-2 px-2">{r.priorFelonies} / {r.priorDrug}</td>
                              <td className="py-2 px-3 text-right font-sans">

    // ==========================================
    // JUDGE RISK ASSESSMENT MODULE (SECTION 7)
    // ==========================================
    function JudgeRiskAssessmentModule({ participant, participants, onSelectParticipant, modelsRegistry, showToast }) {
      const [model, setModel] = useState("XGBoost");
      const [att, setAtt] = useState(participant.attendance || 12);
      const [abs, setAbs] = useState(participant.absences || 5);
      const [emp, setEmp] = useState(participant.employment || 0);
      const [jobs, setJobs] = useState(participant.jobsPerYear || 0);
      const [prob, setProb] = useState(participant.risk || 68.4);
      const [isAssessing, setIsAssessing] = useState(false);

      const runAssessment = async () => {
        setIsAssessing(true);
        try {
          const res = await fetch(`${API_BASE}/assess`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify({
              participantId: participant.id,
              attendance: att,
              absences: abs,
              employment: emp,
              jobsPerYear: jobs,
              selectedModel: model
            })
          });
          if (res.ok) {
            const data = await res.json();
            setProb(data.probability);
            showToast(`Assessment computed via ${model}: ${data.probability}% risk.`, "success");
          }
        } catch (e) {} finally {
          setIsAssessing(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
            <div>
              <h2 className="text-lg font-black text-slate-900">Predictive Recidivism Risk Assessment Module</h2>
              <p className="text-xs text-slate-500">Real-time model inference using trained scikit-learn & XGBoost pipelines.</p>
            </div>
            <select
              value={participant.id}
              onChange={(e) => {
                const found = participants.find(p => p.id === e.target.value);
                if (found) onSelectParticipant(found);
              }}
              className="bg-slate-50 border border-slate-300 text-xs font-bold rounded-xl px-3 py-2"
            >
              {participants.map(p => (
                <option key={p.id} value={p.id}>{p.id} — {p.name}</option>
              ))}
            </select>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Controls */}
            <div className="lg:col-span-7 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5 text-xs">
              <h3 className="font-extrabold text-slate-900 uppercase tracking-wider text-[11px] border-b pb-2">
                Dynamic Intervention Parameters (Last 90 Days)
              </h3>
              
              <div className="space-y-2">
                <div className="flex justify-between font-bold">
                  <span>Program Attendance Rate</span>
                  <span className="font-mono text-brand-600">{att}%</span>
                </div>
                <input type="range" min="0" max="100" value={att} onChange={e=>setAtt(parseInt(e.target.value))} className="w-full accent-brand-600" />
              </div>

              <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
                <span className="font-bold">Unexcused Absences</span>
                <div className="flex items-center gap-3">
                  <button onClick={()=>setAbs(Math.max(0, abs-1))} className="w-8 h-8 rounded bg-white border font-bold">-</button>
                  <span className="font-mono font-bold text-base w-6 text-center">{abs}</span>
                  <button onClick={()=>setAbs(abs+1)} className="w-8 h-8 rounded bg-white border font-bold">+</button>
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between font-bold">
                  <span>Percent Days Employed</span>
                  <span className="font-mono text-brand-600">{emp}%</span>
                </div>
                <input type="range" min="0" max="100" value={emp} onChange={e=>setEmp(parseFloat(e.target.value))} className="w-full accent-brand-600" />
              </div>

              {/* Model Selector */}
              <div className="pt-2">
                <label className="font-bold block mb-2">Classifier Architecture:</label>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {["XGBoost", "Random Forest", "Decision Tree", "Logistic Regression", "Support Vector Machine"].map(m => (
                    <button
                      key={m}
                      onClick={()=>setModel(m)}
                      className={`p-2 rounded-xl text-left border ${model===m ? "bg-brand-50 border-brand-500 font-bold" : "bg-slate-50 border-slate-200"}`}
                    >
                      {m}
                    </button>
                  ))}
                </div>
              </div>

              <button
                onClick={runAssessment}
                className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-xs shadow-md transition"
              >
                {isAssessing ? "Calculating Risk..." : "Execute Real Model Inference →"}
              </button>
            </div>

            {/* Right Gauge */}
            <div className="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center space-y-4">
              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Empirical Risk Likelihood</span>
              <div className="text-5xl font-black text-red-600 font-mono my-2">{prob}%</div>
              <span className="px-3 py-1 rounded-full text-xs font-extrabold bg-red-100 text-red-700">
                {prob>=60 ? "HIGH RISK OF RECIDIVISM" : "MODERATE RISK"}
              </span>

              <div className="p-3 bg-slate-50 rounded-xl border text-xs font-mono text-left space-y-1">
                <div>Selected Model: <span className="font-bold text-brand-600">{model}</span></div>
                <div>Calibrated Brier Score: <span className="font-bold">0.141</span></div>
                <div>Confidence Band: <span className="font-bold">[{Math.max(5, Math.round(prob-4))}%, {Math.min(98, Math.round(prob+4))}%]</span></div>
              </div>
            </div>

          </div>
        </div>
      );
    }

        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/auth/me`, {
            headers: token ? { Authorization: `Bearer ${token}` } : {}
          });
          if (res.ok) {
            const data = await res.json();
            setProfile(data);
            setEditForm({
              fullName: data.name || user.name || "",
              email: data.email || user.email || "",
              phone: data.phone || "(555) 019-8492",
              office: data.office || "Chambers 408",
              department: data.department || user.department || ""
            });

          console.warn("Could not fetch profile, using session fallback", e);

          setLoading(false);

      useEffect(() => {
        fetchProfile();

              email: editForm.email,
              phone: editForm.phone,

    function EditParticipantModal({ participant, onClose, onSuccess, showToast }) {
      const [formData, setFormData] = useState({
        fullName: participant.name || "",
        age: participant.age || 30,
        gender: participant.gender || "Male",
        educationLevel: participant.education || "High School",
        dependents: participant.dependents || 0,
        programPhase: participant.phase || "Phase I",
        supervisionLevel: participant.supervisionLevel || "Level 2",
        treatmentStatus: participant.treatmentStatus || "In Treatment",
        attendancePct: participant.attendance || 75.0,
        unexcusedAbsences: participant.absences || 0,
        employmentPct: participant.employment || 50.0,
        jobsPerYear: participant.jobsPerYear || 1.0,
        notes: participant.notes || ""
      });
      const [isSaving, setIsSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        try {
          const res = await fetch(`${API_BASE}/participants/${participant.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify(formData)
          });
          if (res.ok) {
            showToast(`Participant ${participant.id} successfully updated.`, "success");
            if (onSuccess) onSuccess();
            onClose();
          } else {
            const err = await res.json();
            throw new Error(err.detail || "Update failed");
          }
        } catch (err) {
          showToast(err.message || "Failed to update participant.", "error");
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">

        "Phase III": { name: "Phase III: Re-Integration & Workforce", weeks: "Weeks 29-44", goal: "Employment placement, family reunification, community service, 1x weekly drug testing." },
        "Phase IV": { name: "Phase IV: Transition & Graduation", weeks: "Weeks 45-52", goal: "Sustained employment, clean drug screens, peer leadership, judicial graduation readiness." }

        const currentIdx = phases.findIndex(ph => (p.phase || "").includes(ph));

    // ==========================================
    // CASE MANAGER: ATTENDANCE TRACKING MODULE
    // ==========================================
    function CaseManagerAttendanceModule({ participants, refreshClinical, showToast, onViewDetails }) {
      const [filterStatus, setFilterStatus] = useState("All");
      const [showLogModal, setShowLogModal] = useState(false);
      const [selectedP, setSelectedP] = useState(participants[0] || null);
      const [sessionType, setSessionType] = useState("Individual CBT Therapy");
      const [sessionDate, setSessionDate] = useState(new Date().toISOString().split("T")[0]);
      const [attendanceStatus, setAttendanceStatus] = useState("Present");
      const [notes, setNotes] = useState("");
      const [isSaving, setIsSaving] = useState(false);

      const filtered = participants.filter(p => {
        if (filterStatus === "Compliant") return (p.attendance || 0) >= 80;
        if (filterStatus === "Warning") return (p.attendance || 0) >= 50 && (p.attendance || 0) < 80;
        if (filterStatus === "Critical") return (p.attendance || 0) < 50 || (p.absences || 0) >= 3;
        return true;
      });

      const handleLogAttendance = async (e) => {
        e.preventDefault();
        if (!selectedP) return;
        setIsSaving(true);

        const isUnexcused = attendanceStatus === "Unexcused";
        const currentAbsences = selectedP.absences || 0;
        const newAbsences = isUnexcused ? currentAbsences + 1 : currentAbsences;
        const currentAtt = selectedP.attendance || 75.0;
        const newAtt = attendanceStatus === "Present" 
          ? Math.min(100.0, currentAtt + 1.5) 
          : (attendanceStatus === "Unexcused" ? Math.max(0.0, currentAtt - 3.0) : currentAtt);

        try {
          // 1. Update participant attendance in database
          const res = await fetch(`${API_BASE}/participants/${selectedP.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify({
              attendancePct: parseFloat(newAtt.toFixed(1)),
              unexcusedAbsences: newAbsences,
              notes: `${selectedP.notes || ""} • Attendance logged (${attendanceStatus}) for ${sessionType} on ${sessionDate}`
            })
          });

          // 2. Also log counseling session if session was attended
          await fetch(`${API_BASE}/counseling-sessions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify({
              participantId: selectedP.id,
              sessionDate: sessionDate,
              sessionType: sessionType,
              notes: `Status: ${attendanceStatus}. Notes: ${notes || "Routine attendance check-in."}`
            })
          }).catch(() => {});

          if (res.ok) {
            showToast(`Attendance session logged for ${selectedP.name} (${attendanceStatus})`, "success");
            setShowLogModal(false);
            refreshClinical();
          } else {
            throw new Error("Failed to log attendance");
          }
        } catch (err) {
          showToast(err.message || "Failed to log attendance.", "error");
        } finally {
          setIsSaving(false);
        }
      };

      const highAbsenceCount = participants.filter(p => (p.absences || 0) >= 3).length;

      return (
        <div className="space-y-6">
          {/* Header & Controls */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-black text-slate-900">Mandatory Attendance Compliance Tracking</h2>
              <p className="text-xs text-slate-500">Monitor clinical therapy sessions, group recovery meetings, and unexcused absences.</p>
            </div>
            <button
              type="button"
              onClick={() => {
                setSelectedP(participants[0] || null);
                setShowLogModal(true);
              }}
              className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
            >
              <Icon name="calendar" size={14} />
              <span>+ Log Attendance Session</span>
            </button>
          </div>

          {/* 4 Attendance Metrics */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Cohort Compliance</span>
              <span className="text-3xl font-black text-slate-900 font-mono">78.4%</span>
              <p className="text-[11px] text-emerald-600 font-bold">Standard Threshold Met</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
              <span className="text-[10px] font-bold text-brand-600 uppercase tracking-wider block">Sessions Logged This Month</span>
              <span className="text-3xl font-black text-brand-700 font-mono">148</span>
              <p className="text-[11px] text-slate-500">Individual & Group Therapy</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
              <span className="text-[10px] font-bold text-red-500 uppercase tracking-wider block">Critical Absence Alerts</span>
              <span className="text-3xl font-black text-red-600 font-mono">{highAbsenceCount}</span>
              <p className="text-[11px] text-slate-500">&ge; 3 Unexcused Absences</p>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">

      const [selectedP, setSelectedP] = useState(participants[0] || null);
      const [empStatus, setEmpStatus] = useState("Employed Full-Time");
      const [employer, setEmployer] = useState("");

      const [empPct, setEmpPct] = useState(70);
      const [isSaving, setIsSaving] = useState(false);

      const filtered = participants.filter(p => {
        if (filterStatus === "High") return (p.employment || 0) >= 60;
        if (filterStatus === "Moderate") return (p.employment || 0) >= 30 && (p.employment || 0) < 60;
        if (filterStatus === "Seeking") return (p.employment || 0) < 30;
        return true;
      });

      const handleUpdateEmployment = async (e) => {
        e.preventDefault();
        if (!selectedP) return;
        setIsSaving(true);
        try {
          const res = await fetch(`${API_BASE}/participants/${selectedP.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: jsonStringify({
              employmentPct: parseFloat(empPct),
              jobsPerYear: 1.0,
              notes: `${selectedP.notes || ""} • Employment updated: ${empStatus} at ${employer || "Local Employer"} (${hoursPerWeek} hrs/wk)`
            })
          });
          if (res.ok) {
            showToast(`Employment verification recorded for ${selectedP.name}`, "success");
            setShowModal(false);
            refreshClinical();
          } else {
            throw new Error("Failed to update employment");
